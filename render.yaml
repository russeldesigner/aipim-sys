services:
  - type: web
    name: aipim-sys
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    disk:
      name: aipim-db
      mountPath: /data
      sizeGB: 1
